name: Mid-priced-YES convergence paper-trade tracker

on:
  schedule:
    # every 6 hours — catches markets as they enter the ~5-day-to-resolution window
    - cron: "15 */6 * * *"
  workflow_dispatch:       # run manually from the Actions tab any time

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to commit the ledger back

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" 2>/dev/null || pip install pandas numpy scipy requests tabulate scikit-learn matplotlib seaborn tqdm

      - name: Run mid-priced-YES [10,50) update
        run: python experiments/run_midprice_yes_paper_update.py --fraction 0.10

      - name: Run mid-priced-YES [10,20) update
        run: python experiments/run_midprice_yes_paper_update.py --fraction 0.10 --lo 0.10 --hi 0.20 --ledger-file data/paper_trade/midprice_yes_10_20_positions.csv

      - name: Run mid-priced-YES [10,30) update
        run: python experiments/run_midprice_yes_paper_update.py --fraction 0.10 --lo 0.10 --hi 0.30 --ledger-file data/paper_trade/midprice_yes_10_30_positions.csv

      - name: Run mid-priced-YES [20,40) update
        run: python experiments/run_midprice_yes_paper_update.py --fraction 0.10 --lo 0.20 --hi 0.40 --ledger-file data/paper_trade/midprice_yes_20_40_positions.csv

      - name: Generate dashboard
        run: python experiments/generate_dashboard.py

      - name: Commit ledger if changed
        run: |
          git config user.name  "paper-trade-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/paper_trade/midprice_yes_positions.csv data/paper_trade/midprice_yes_10_20_positions.csv data/paper_trade/midprice_yes_10_30_positions.csv data/paper_trade/midprice_yes_20_40_positions.csv data/paper_trade/midprice_yes_benchmark.csv data/paper_trade/dashboard.html || true
          if ! git diff --cached --quiet; then
            git commit -m "midprice-yes paper-trade: update $(date -u +%Y-%m-%d_%H:%M)"
            git push
          else
            echo "No ledger changes — nothing to commit."
          fi
