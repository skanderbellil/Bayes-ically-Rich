name: Paper-trade tracker — all strategies

on:
  schedule:
    # hourly — public repo, free minutes, keeps MTM fresh across all strategies
    - cron: "15 * * * *"
  workflow_dispatch:       # run manually from the Actions tab any time

concurrency:
  group: paper-trade-ledgers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to commit ledgers back

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" 2>/dev/null || pip install pandas numpy scipy requests tabulate scikit-learn matplotlib seaborn tqdm

      - name: Mid-priced-YES — all bands (single scan)
        run: python experiments/run_all_midprice_yes_update.py --fraction 0.10

      - name: Dip-confirm YES
        run: python experiments/run_dip_confirm_paper_update.py --fraction 0.10

      - name: Smart-flow consensus
        run: python experiments/run_smart_flow_paper_update.py --fraction 0.10 --min-buyers 3 --consensus-exit --flip-threshold 1

      - name: Smart-flow consensus (ROI-selected, forward test)
        run: python experiments/run_smart_flow_paper_update.py --fraction 0.10 --selector roi_topn --top-n 10 --min-buyers 2 --consensus-exit --flip-threshold 1

      - name: Macro
        run: python experiments/run_paper_trade_update.py --fraction 0.10

      - name: Regime-calm disruptive-tail (forward ledger)
        id: regime_paper
        continue-on-error: true
        run: python experiments/run_regime_paper_update.py

      - name: Regime per-domain validation (refresh validated set)
        id: regime_domain_validation
        continue-on-error: true
        run: python experiments/run_regime_domain_validation.py

      - name: Validated regime strategy (geo-calm forward ledger)
        id: validated_regime_paper
        continue-on-error: true
        run: python experiments/run_validated_regime_paper_update.py

      - name: Bankroll simulation (real $1k returns)
        run: python experiments/run_bankroll_sim.py --capital 1000 --stake 0.10

      - name: Champion stack (equity forward ledger)
        run: python experiments/run_champion_paper_update.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Generate dashboard
        run: python experiments/generate_dashboard.py

      - name: Order-book snapshots
        run: python experiments/run_book_snapshot.py

      - name: Commit ledgers if changed
        run: |
          git config user.name  "paper-trade-bot"
          git config user.email "bot@users.noreply.github.com"
          git add \
            data/paper_trade/midprice_yes_positions.csv \
            data/paper_trade/midprice_yes_10_20_positions.csv \
            data/paper_trade/midprice_yes_10_30_positions.csv \
            data/paper_trade/midprice_yes_20_40_positions.csv \
            data/paper_trade/midprice_yes_benchmark.csv \
            data/paper_trade/dip_confirm_positions.csv \
            data/paper_trade/smart_flow_positions.csv \
            data/paper_trade/smart_flow_roi_positions.csv \
            data/paper_trade/macro_positions.csv \
            data/paper_trade/regime_positions.csv \
            data/paper_trade/validated_regime_positions.csv \
            data/paper_trade/champion_positions.csv \
            data/polymarket_calibration_snapshot/validated_domains.json \
            data/paper_trade/bankroll_summary.csv \
            data/paper_trade/book_snapshots.csv.gz \
            data/paper_trade/dashboard.html || true
          if ! git diff --cached --quiet; then
            git commit -m "paper-trade: update $(date -u +%Y-%m-%d_%H:%M)"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          else
            echo "No ledger changes — nothing to commit."
          fi

      - name: Fail job if any regime step failed
        if: >
          steps.regime_paper.outcome == 'failure' ||
          steps.regime_domain_validation.outcome == 'failure' ||
          steps.validated_regime_paper.outcome == 'failure'
        run: |
          echo "One or more regime steps failed:"
          echo "  regime_paper:              ${{ steps.regime_paper.outcome }}"
          echo "  regime_domain_validation:  ${{ steps.regime_domain_validation.outcome }}"
          echo "  validated_regime_paper:    ${{ steps.validated_regime_paper.outcome }}"
          exit 1
