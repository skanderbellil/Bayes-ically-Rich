name: Macro paper-trade tracker

on:
  schedule:
    # 09:00 UTC daily — after most macro markets open for the day
    - cron: "0 9 * * *"
  workflow_dispatch:       # run manually from GitHub Actions tab any time

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to commit the ledger back

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" 2>/dev/null || pip install pandas numpy scipy requests tabulate scikit-learn matplotlib seaborn tqdm

      - name: Run daily update
        run: python experiments/run_paper_trade_update.py --fraction 0.10

      - name: Commit ledger if changed
        run: |
          git config user.name  "paper-trade-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/paper_trade/macro_positions.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "paper-trade: daily update $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No ledger changes — nothing to commit."
          fi
